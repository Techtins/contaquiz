services:
  postgres:
    image: postgres:16-alpine
    container_name: contaquiz-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localpassword
      POSTGRES_DB: contaquiz_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - contaquiz-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend/backend-quiz
    container_name: contaquiz-backend
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=${PORT:-8080}
      - DB_URL=jdbc:postgresql://postgres:5432/contaquiz_db
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-localpassword}
      - JWT_SECRET=${JWT_SECRET:-contaquiz-dev-secret}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - contaquiz-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: contaquiz-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN:-}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/next.config.ts:/app/next.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/postcss.config.mjs:/app/postcss.config.mjs
      - ./frontend/sentry.client.config.ts:/app/sentry.client.config.ts
      - ./frontend/sentry.server.config.ts:/app/sentry.server.config.ts
      - ./frontend/sentry.edge.config.ts:/app/sentry.edge.config.ts
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - contaquiz-net
    restart: unless-stopped

volumes:
  pgdata:
  frontend_node_modules:

networks:
  contaquiz-net:
    driver: bridge
