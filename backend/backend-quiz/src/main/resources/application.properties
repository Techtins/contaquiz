# Quarkus
quarkus.http.port=${PORT:8080}

#CORS
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type

# Database
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USER:postgres}
%prod.quarkus.datasource.password=${DB_PASSWORD:postgres}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/contaquiz_db}

# Hibernate ORM
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=db/seed.sql

# DevServices - PostgreSQL automático em modo dev (recomendado para desenvolvimento)
# Quando habilitado, ignora as configurações de datasource acima e sobe um container automaticamente
%dev.quarkus.datasource.devservices.enabled=${DEVSERVICES_ENABLED:true}
%dev.quarkus.datasource.devservices.image-name=postgres:16-alpine
%dev.quarkus.datasource.devservices.db-name=contaquiz_db
%dev.quarkus.datasource.devservices.username=postgres
%dev.quarkus.datasource.devservices.password=postgres

# Para usar banco externo em dev, defina: export DEVSERVICES_ENABLED=false

# JWT
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:META-INF/public_key.pem}
mp.jwt.verify.issuer=${JWT_ISSUER:ContaQuiz}
smallrye.jwt.sign.key.location=${JWT_SIGN_KEY_LOCATION:META-INF/private_key.pem}

# Argon2id - parametros OWASP 2024
app.security.argon2.iterations=${ARGON2_ITERATIONS:3}
app.security.argon2.memory=${ARGON2_MEMORY:65536}
app.security.argon2.parallelism=${ARGON2_PARALLELISM:4}
app.security.argon2.hash-length=${ARGON2_HASH_LENGTH:32}
app.security.argon2.salt-length=${ARGON2_SALT_LENGTH:16}
